name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Manual trigger — also runs the 50-player stress test, which is slower.
  workflow_dispatch:
  # Nightly so CVE drift in pinned dependencies surfaces between PRs.
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: pnpm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported (matches engines in package.json): the
        # pinned package manager, pnpm 11, refuses to run below Node 22.13,
        # and Node 18 / 20 are both end-of-life. 24 is current.
        # GitHub Actions runners default to Node 24 from June 2026 onward.
        # The default dev/deploy version lives in .nvmrc; this matrix
        # intentionally tests the whole supported range.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version here on purpose: reads "packageManager" from package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: fail the build for any HIGH-or-above advisory. Lower-severity
      # advisories surface via Dependabot PRs instead of breaking CI.
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level=high

      - name: Run test suite
        run: pnpm test
        env:
          # Stable, predictable tokens so the suite doesn't have to scrape the
          # boot banner. Test-only — real deploys use real secrets.
          HOST_TOKEN: ci-host-token-do-not-use-in-prod
          ADMIN_TOKEN: ci-admin-token-do-not-use-in-prod
          COOKIE_SECRET: ci-cookie-secret-for-tests-only
          NODE_ENV: test

  container-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip on PR forks (Trivy needs to push results to the security tab and
    # forks don't have write access). Still runs on push to main + nightly.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t omegaquiz:ci .

      # The bundled sample packs are read from disk at runtime; an image built
      # without samples/ boots fine and only fails when an admin opens
      # "Browse sample packs". Catch that here rather than in production.
      - name: Smoke-test image (bundled sample packs present)
        run: |
          docker run --rm --entrypoint node omegaquiz:ci -e '
            const m = require("/app/samples/manifest.json");
            if (!Array.isArray(m.packs) || m.packs.length === 0) throw new Error("manifest has no packs");
            for (const p of m.packs) require("/app/samples/" + p.url.replace("bundled:samples/", ""));
            console.log("bundled sample packs present: " + m.packs.length);
          '

      # Note: aquasecurity/trivy-action has had supply-chain incidents in the
      # past (compromised releases in 2024 and 2025), so it is pinned to a
      # commit SHA like the other actions here. Its release tags are `vX.Y.Z`
      # (a bare `0.36.0` ref does not exist and fails the job at "Set up job");
      # the version comment lets Renovate bump the SHA. Releases:
      # https://github.com/aquasecurity/trivy-action/releases
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omegaquiz:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # OS packages + Node deps + secrets. Misconfig scanning is noisy for
          # this tiny image; leaving it off keeps the signal-to-noise high.
          scanners: vuln,secret

  stress:
    name: 50-player stress run
    # Only on manual dispatch — runs ~45s and we don't need it on every PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version here on purpose: reads "packageManager" from package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Run stress test
        run: pnpm stress
        env:
          HOST_TOKEN: ci-host-token-do-not-use-in-prod
          ADMIN_TOKEN: ci-admin-token-do-not-use-in-prod
          COOKIE_SECRET: ci-cookie-secret-for-tests-only
